<title>Fronts of 1914</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap">
<style>
/* Layout: full-bleed voxel map; HUD as pinned dispatch panels on the edges (top bar, region file left, powers right, telegrams bottom) */
:root{
  --ink:#0b0f0d;          /* ground behind the map */
  --panel:#141a16;        /* dispatch panel */
  --panel-2:#1c241e;      /* raised controls */
  --rule:#34412f;         /* pixel borders */
  --paper:#e6dec3;        /* text, like old map paper */
  --muted:#a3a990;        /* secondary text */
  --brass:#d7aa4e;        /* accent: insignia brass */
  --alarm:#e86a52;        /* battle / danger */
  --ok:#94c46f;
  --f-display:'Silkscreen','Courier New',monospace;
  --f-body:'VT323','Courier New',monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--f-body);font-size:20px;line-height:1.1;overflow:hidden;-webkit-font-smoothing:none}
#app{position:fixed;inset:0;overflow:hidden;user-select:none;-webkit-user-select:none}
#view{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;cursor:grab}
#view.drag{cursor:grabbing}
#view.order{cursor:crosshair}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}

.panel{background:color-mix(in srgb,var(--panel) 94%,transparent);border:2px solid var(--rule);box-shadow:4px 4px 0 rgba(0,0,0,.55)}
.lbl{font-family:var(--f-display);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.lbl b{color:var(--paper);font-weight:400}
.btn{font-family:var(--f-display);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--paper);background:var(--panel-2);border:2px solid var(--rule);box-shadow:2px 2px 0 #000;padding:7px 8px 6px;cursor:pointer;min-height:32px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--brass)}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:none}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.on{background:var(--brass);color:#1a1408;border-color:var(--brass)}
.btn:focus-visible,.pick:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.chip{display:inline-block;width:10px;height:10px;background:var(--c);border:2px solid #000;flex:none}

/* top bar */
#top{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:14px;padding:6px 8px;flex-wrap:wrap}
.crest{width:34px;height:34px;display:grid;place-items:center;background:var(--c,#555);color:#0b0f0d;font-family:var(--f-display);font-weight:700;font-size:12px;border:2px solid #000;flex:none}
.tb{display:flex;flex-direction:column;gap:2px;min-width:0}
.tb .v{font-size:22px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tb .v .inc{color:var(--ok);font-size:18px}
.bar{width:120px;height:8px;background:#000;border:2px solid var(--rule);position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--brass);width:0}
.spacer{flex:1}
.speed{display:flex;gap:4px}
.speed .btn{min-width:38px}
.tbtns{display:flex;gap:6px;flex-wrap:wrap}

/* region file */
#tp{position:absolute;left:max(8px,env(safe-area-inset-left,0px));top:calc(70px + env(safe-area-inset-top,0px));width:300px;max-height:calc(100% - 90px);overflow:auto;padding:12px;display:flex;flex-direction:column;gap:12px}
#tp h2{font-family:var(--f-display);font-size:18px;font-weight:700;margin:0;letter-spacing:.02em;text-wrap:balance}
#tp .eyebrow{font-family:var(--f-display);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--brass)}
#tp .owner{display:flex;align-items:center;gap:8px;font-size:20px}
#tp .cap{font-family:var(--f-display);font-size:9px;color:#1a1408;background:var(--brass);padding:2px 4px 1px;letter-spacing:.06em}
#tp .x{position:absolute;right:8px;top:8px;width:32px;height:32px;background:transparent;border:0;color:var(--muted);cursor:pointer;display:grid;place-items:center}
#tp .x:hover{color:var(--paper)}
#tp{position:absolute}
.sect{display:flex;flex-direction:column;gap:8px;border-top:2px solid var(--rule);padding-top:10px}
.garr{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.garr div{background:#0d120f;border:2px solid var(--rule);padding:4px 6px;display:flex;flex-direction:column;gap:2px}
.garr .ut{font-family:var(--f-display);font-size:9px;color:var(--muted);letter-spacing:.06em}
.garr b{font-weight:400;font-size:24px;font-variant-numeric:tabular-nums}
.works{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:19px}
.works .off{color:#5d6555;text-decoration:line-through}
.pips{letter-spacing:2px;color:var(--brass)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.btn.u{flex-direction:column;align-items:flex-start;gap:3px;padding:6px 8px;min-height:44px}
.btn.u em{font-style:normal;font-family:var(--f-body);font-size:18px;letter-spacing:0;text-transform:none;color:var(--brass)}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.seg .btn{padding:6px 2px}
.hint{margin:0;color:var(--muted);font-size:18px;line-height:1.05}
.hint b{color:var(--paper);font-weight:400}
.alarm{color:var(--alarm)}
.sect.alarm .lbl{color:var(--alarm)}
.atk{display:flex;flex-direction:column;gap:6px}
.atk .btn{justify-content:space-between}

/* powers */
#powers{position:absolute;right:max(8px,env(safe-area-inset-right,0px));top:calc(70px + env(safe-area-inset-top,0px));width:260px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
#powers table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
#powers td{padding:2px 0;font-size:18px;white-space:nowrap}
#powers td.n{text-align:right;padding-left:8px}
#powers tr.me td{color:var(--brass)}
#powers tr.dead td{color:#5d6555;text-decoration:line-through}
#powers .hd td{font-family:var(--f-display);font-size:9px;color:var(--muted);letter-spacing:.06em}

/* telegrams */
#log{position:absolute;right:max(8px,env(safe-area-inset-right,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));width:min(360px,calc(100% - 16px));padding:8px 10px;display:flex;flex-direction:column;gap:4px}
#log ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
#log li{font-size:17px;line-height:1.05;color:var(--muted)}
#log li time{color:#6f7766;margin-right:6px;font-variant-numeric:tabular-nums}
#log li.me{color:var(--paper)}
#log li.bad{color:var(--alarm)}
#log li.good{color:var(--ok)}

/* battle card */
#bcard{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100% - 16px));padding:10px 12px;display:flex;flex-direction:column;gap:6px}
#bcard h3{margin:0;font-family:var(--f-display);font-size:13px;letter-spacing:.04em}
.side{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:18px}
.side .sb{height:8px;background:#000;border:2px solid var(--rule);position:relative}
.side .sb i{position:absolute;inset:0 auto 0 0;background:var(--c)}

/* labels on map */
.tl{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--f-display);font-size:10px;line-height:1;white-space:nowrap;will-change:transform}
.tl .n{background:var(--c);color:#0b0f0d;border:2px solid #0b0f0d;padding:2px 4px 1px;min-width:14px;text-align:center;font-variant-numeric:tabular-nums}
.tl .nm{color:var(--paper);text-shadow:1px 0 #000,-1px 0 #000,0 1px #000,0 -1px #000,1px 1px #000;font-size:9px;letter-spacing:.06em;text-transform:uppercase}
.tl.sel .n{outline:2px solid var(--paper)}
.tl.tg .n{outline:2px dashed var(--alarm);outline-offset:1px}
.tl.ar .n{border-style:dashed}
.bm{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;background:#0b0f0d;border:2px solid var(--alarm);color:var(--alarm);padding:3px 5px;display:flex;align-items:center;gap:5px;font-family:var(--f-display);font-size:9px;will-change:transform}
.bm svg{display:block}
.bm:hover{background:#2a120d}

#toast{position:absolute;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:#0b0f0d;border:2px solid var(--brass);padding:6px 12px;font-size:20px;max-width:calc(100% - 32px);text-align:center;box-shadow:4px 4px 0 #000;pointer-events:none}

/* modal */
.modal{position:absolute;inset:0;background:rgba(5,8,6,.72);display:grid;place-items:center;padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:auto}
.sheet{width:min(720px,100%);padding:24px;display:flex;flex-direction:column;gap:14px;max-height:100%;overflow:auto}
.sheet h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,6vw,48px);margin:0;line-height:1;letter-spacing:.02em;text-wrap:balance}
.sheet h2{font-family:var(--f-display);font-weight:700;font-size:20px;margin:0;text-wrap:balance}
.kicker{font-family:var(--f-display);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass)}
.lede{font-size:22px;margin:0;max-width:62ch;color:var(--paper)}
.sheet p{margin:0;max-width:62ch}
.picks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pick{font:inherit;color:var(--paper);background:var(--panel-2);border:2px solid var(--rule);box-shadow:3px 3px 0 #000;padding:10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:44px}
.pick:hover{border-color:var(--c)}
.pick i{display:block;height:8px;background:var(--c);border:2px solid #000}
.pick b{font-family:var(--f-display);font-size:11px;font-weight:700;letter-spacing:.03em}
.pick span{color:var(--muted);font-size:18px}
.orders{border:2px dashed var(--brass);padding:14px;display:flex;flex-direction:column;gap:8px;background:#100f0a}
.orders .stamp{font-family:var(--f-display);font-size:9px;color:var(--alarm);border:2px solid var(--alarm);align-self:flex-start;padding:3px 5px 2px;letter-spacing:.1em}
.prog{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:19px}
.prog b{color:var(--paper);font-weight:400}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0}
.keys dt{font-family:var(--f-display);font-size:10px;color:var(--brass);padding-top:4px;letter-spacing:.04em}
.keys dd{margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap}

@media (max-width:860px){
  #powers{display:none}
  #powers.open{display:flex}
  #log{display:none}
  .conv .bar{width:70px}
  .hidem{display:none!important}
}
@media (max-width:640px){
  #top{gap:8px}
  #tp{left:8px;right:8px;width:auto;top:auto;bottom:calc(8px + env(safe-area-inset-bottom,0px));max-height:46%}
  #bcard{bottom:auto;top:calc(120px + env(safe-area-inset-top,0px))}
  .picks{grid-template-columns:repeat(2,minmax(0,1fr))}
  #powers{left:8px;right:8px;width:auto;top:calc(120px + env(safe-area-inset-top,0px))}
}
@media (prefers-reduced-motion:reduce){.btn:active:not(:disabled){transform:none}}
</style>

<div id="app">
  <canvas id="view" aria-label="World map of 1914"></canvas>
  <div id="labels" aria-hidden="true"></div>

  <header id="top" class="panel">
    <div class="crest" id="crest">GB</div>
    <div class="tb hidem"><div class="lbl">Power</div><div class="v" id="tb-name">—</div></div>

    <div class="tb hidem"><div class="lbl">Date</div><div class="v" id="tb-date">1 Aug 1914</div></div>
    <div class="spacer"></div>
    <div class="speed" role="group" aria-label="Game speed">
      <button class="btn" data-speed="0" aria-label="Pause">II</button>

      <button class="btn" data-speed="2">2×</button>
      <button class="btn" data-speed="4">4×</button>

    <div class="tbtns">
      <button class="btn" id="b-orders">Orders</button>
      <button class="btn" id="b-powers">Powers</button>
      <button class="btn" id="b-help">Help</button>
      <button class="btn hidem" id="b-px">Pixels 3×</button>
    </div>
  </header>

  <aside id="tp" class="panel" hidden aria-live="polite"></aside>
  <aside id="powers" class="panel" aria-label="Powers"></aside>
  <section id="log" class="panel" aria-label="Telegrams"><div class="lbl">Telegrams</div><ol id="log-list"></ol></section>
  <div id="bcard" class="panel" hidden></div>
  <div id="toast" hidden></div>
  <div id="modal" class="modal"><div class="sheet panel" id="sheet"></div></div>
</div>

  for(let i=0;i<N;i++){ if(!land[i]) continue; const c=i%COLS;
    for(const j of [c<COLS-1?i+1:-1,i+COLS<N?i+COLS:-1]) if(j>=0&&land[j]&&terrOf[j]!==terrOf[i]){ terrs[terrOf[i]].adj.add(terrOf[j]); terrs[terrOf[j]].adj.add(terrOf[i]); } }

    let mx=0,mz=0; for(const i of t.tiles){mx+=i%COLS;mz+=(i/COLS)|0;} mx/=t.tiles.length; mz/=t.tiles.length;

function sendArmy(fid,fromId,toId,frac){

  if(A.battle) return `${A.name} is under attack. Its troops cannot leave.`;
  if(!A.adj.has(toId)) return `${B.name} does not border ${A.name}.`;
  const tot=total(A.units); if(tot<2) return `${A.name} needs at least 2 units to march. One always stays behind.`;

}

function makeGround(b){

function joinBattle(b,f,u,dir,def){

  for(const k of TYPES) for(let n=0;n<u[k];n++){
    let along,lat;
    if(def){ along=k==='art'?-7-rand()*2:(k==='tank'?-2+rand()*2:1.4+rand()*.9); lat=(rand()-.5)*26; }
    else { along=(k==='art'?26:20)+rand()*4; lat=(rand()-.5)*22; }
    const s=UT[k];
    b.agents.push({f,type:k,x:a.x*along+p.x*lat,z:a.z*along+p.z*lat,hp:s.hp,cd:rand()*s.rof,rt:0,tgt:null,dead:false,dieT:0,face:Math.atan2(-a.x,-a.z)+(def?Math.PI:0),phase:rand()*6,moving:false,trench:def&&k!=='art'&&k!=='tank'});

function nearestEnemy(b,a){ let best=null,bd=1e9; for(const o of b.agents){ if(o.dead||o.f===a.f) continue; const d=(o.x-a.x)**2+(o.z-a.z)**2; if(d<bd){bd=d;best=o;} } return best; }
function damage(b,t,dmg,src){

  if(t.trench&&t.f===b.t.owner) dmg*=Math.max(.35,.8-.15*b.t.trench);
  t.hp-=dmg; if(t.hp<=0){ t.dead=true; t.dieT=G.time; if(visibleBattle(b)&&t.type==='tank') boom(b,t.x,t.z,1.4); }
}
function visibleBattle(b){ return cam.dist<30&&Math.hypot(b.cx-cam.tx,b.cz-cam.tz)<15; }
function wpos(b,x,z){ return [b.cx+x*BS,b.cz+z*BS]; }
function boom(b,x,z,s=1){
  const [wx,wz]=wpos(b,x,z), y=b.y;
  parts.push({x:wx,y:y+.05,z:wz,vx:0,vy:0,vz:0,g:0,life:0,max:.16,s:.16*s,s1:.28*s,c:K.fire,glow:true});
  for(let i=0;i<7;i++){ const an=rand()*6.28, sp=.3+rand()*.6; parts.push({x:wx,y:y+.03,z:wz,vx:Math.cos(an)*sp*s,vy:(1+rand())*s,vz:Math.sin(an)*sp*s,g:4,life:0,max:.7,s:.035,s1:.03,c:K.dirt,floor:y}); }
  for(let i=0;i<3;i++) parts.push({x:wx+(rand()-.5)*.1,y:y+.08,z:wz+(rand()-.5)*.1,vx:(rand()-.5)*.05,vy:.18,vz:(rand()-.5)*.05,g:0,life:0,max:1.6+rand(),s:.08*s,s1:.2*s,c:rand()<.5?K.smoke:K.smoke2});

}
function stepBattle(b,dt){
  if(b.ended) return;
  b.age+=dt; const A=b.agents, charge=b.age>180, vis=visibleBattle(b);
  for(const a of A){
    if(a.dead) continue; const s=UT[a.type];
    a.cd-=dt; a.rt-=dt;
    if(!a.tgt||a.tgt.dead||a.rt<=0){ a.tgt=nearestEnemy(b,a); a.rt=.35+rand()*.45; }
    const t=a.tgt; if(!t){ a.moving=false; continue; }
    const dx=t.x-a.x, dz=t.z-a.z, d=Math.hypot(dx,dz)||.001;
    a.face=Math.atan2(dx,dz);
    if(d<=s.range){
      a.moving=false;
      if(a.cd<=0){
        a.cd=s.rof*(.75+rand()*.5);
        if(a.type==='art'){ b.shells.push({x:t.x+(rand()-.5)*3.5,z:t.z+(rand()-.5)*3.5,time:.5+d*.03,f:a.f,dmg:s.dmg});
          if(vis){ const [wx,wz]=wpos(b,a.x+Math.sin(a.face)*1.6,a.z+Math.cos(a.face)*1.6); parts.push({x:wx,y:b.y+.1,z:wz,vx:0,vy:.2,vz:0,g:0,life:0,max:.1,s:.07,s1:.12,c:K.flash,glow:true}); } }
        else {
          const hit=rand()<s.acc*(1-.45*d/s.range);
          if(hit) damage(b,t,s.dmg,a.type);
          if(vis){ const [x0,z0]=wpos(b,a.x,a.z), [x1,z1]=wpos(b,t.x+(hit?0:(rand()-.5)*1.5),t.z+(hit?0:(rand()-.5)*1.5));
            tracers.push({x0,z0,x1,z1,y0:b.y+(a.type==='tank'?.08:.11),y1:b.y+.09,life:0,max:a.type==='mg'?.05:.07});
            if(rand()<.5) parts.push({x:x0+Math.sin(a.face)*.06,y:b.y+.11,z:z0+Math.cos(a.face)*.06,vx:0,vy:0,vz:0,g:0,life:0,max:.06,s:.03,s1:.02,c:K.flash,glow:true}); }
        }
      }
    } else if(!(a.trench&&!charge)&&!(a.type==='art'&&a.f===b.t.owner&&!charge)){

    for(let j=i+1;j<A.length;j++){ const o=A[j]; if(o.dead) continue; const dx=o.x-a.x, dz=o.z-a.z, d2=dx*dx+dz*dz;

      if(d2<r*r&&d2>1e-6){ const d=Math.sqrt(d2), push=(r-d)*.5/d; if(!a.trench){a.x-=dx*push;a.z-=dz*push;} if(!o.trench){o.x+=dx*push;o.z+=dz*push;} } }
    const R=Math.hypot(a.x,a.z); if(R>26){a.x*=26/R;a.z*=26/R;} }

    for(const o of A){ if(o.dead||o.f===sh.f) continue; const d=Math.hypot(o.x-sh.x,o.z-sh.z); if(d<UT.art.splash) damage(b,o,sh.dmg*(1-d/UT.art.splash*.6),'art'); }
    if(vis) boom(b,sh.x,sh.z,1); }
  if(!vis){ b.puffT-=dt; if(b.puffT<=0){ b.puffT=.22+rand()*.2; const an=rand()*6.28, r=rand()*1.4;
    parts.push({x:b.cx+Math.cos(an)*r,y:b.y+.3,z:b.cz+Math.sin(an)*r,vx:0,vy:.35,vz:0,g:0,life:0,max:2,s:.25+rand()*.15,s1:.55,c:rand()<.5?K.smoke:K.smoke2,map:true});
    if(rand()<.5) parts.push({x:b.cx+(rand()-.5)*2,y:b.y+.4,z:b.cz+(rand()-.5)*2,vx:0,vy:0,vz:0,g:0,life:0,max:.18,s:.35,s1:.5,c:K.fire,glow:true,map:true}); } }
  b.endCheck-=dt;
  if(b.endCheck<=0){ b.endCheck=.3; const fs=new Set(); for(const a of A) if(!a.dead) fs.add(a.f);

function endBattle(b,winner){
  const t=b.t; b.ended=true; b.removeAt=G.time+10; t.battle=null;
  const u=emptyU(); if(winner!==null) for(const a of b.agents) if(!a.dead&&a.f===winner) u[a.type]++;
  const prev=t.owner; t.units=u;
  if(winner!==null&&winner!==prev){
    t.owner=winner; t.trench=Math.max(0,t.trench-1);
    const W=factions[winner], P=factions[prev], capMsg=t.capitalOf===prev?' The capital has fallen.':'';
    if(winner===G.player) log(`Victory at ${t.name}: taken from ${P.the}.${capMsg}`,'good');
    else if(prev===G.player) log(`${t.name} has fallen to ${W.the}.${capMsg}`,'bad');
    else log(`${cap(W.the)} takes ${t.name} from ${P.the}.${capMsg}`);
    paintAround(t.id);
  } else if(winner===prev&&prev===G.player) log(`${t.name} holds. The attack is beaten back.`,'good');
  else if(winner===null&&(prev===G.player||b.sides.has(G.player))) log(`Battle of ${t.name}: no one is left standing.`,'me');
  for(const f of b.sides) checkElim(f,winner);
  if(prev!==winner) checkElim(prev,winner);
  checkMissions(); panelDirty=true;
}
function disposeBattle(b){ scene.remove(b.mesh); b.mesh.geometry.dispose(); b.mesh.material.dispose(); b.tex.dispose(); b.el.remove(); }
function checkElim(fid,by){
  const f=factions[fid]; if(!f||!f.alive||G.over) return;
  if(terrs.some(t=>t.owner===fid)||armies.some(a=>a.owner===fid)||battles.some(b=>!b.ended&&b.agents.some(a=>!a.dead&&a.f===fid))) return;
  f.alive=false; log(`${cap(f.the)} has been destroyed.`,fid===G.player?'bad':'me');
  for(const g of factions){ if(!g.alive||g.mission.type!=='destroy'||g.mission.target!==fid) continue;
    if(by===g.id){ endGame(g.id); return; }
    g.mission={type:'count',n:30,converted:true}; if(g.id===G.player){ log('New orders: hold 30 regions.','me'); toast('Your target fell to another power. New orders: hold 30 regions.'); } }
  if(fid===G.player) endGame(null,'Your last region has fallen. The war is lost.');
}
function checkMissions(){ if(G.over) return; for(const f of factions) if(f.alive&&missionDone(f)){ endGame(f.id); return; } }

/* =========================================================
   economy & AI
   ========================================================= */
function income(fid){
  const mine=terrs.filter(t=>t.owner===fid);
  let v=Math.max(3,Math.floor(mine.length/3));
  for(const k in CONT) if(ownsCont(fid,k)) v+=CONT[k].bonus;
  v+=2*mine.filter(t=>t.factory).length;
  return v;
}
function supplyTick(){
  G.day+=7;
  for(const f of factions){ if(!f.alive) continue; const inc=income(f.id); f.supply+=inc; if(f.id===G.player) flashInc(inc); }
  for(const t of terrs) if(t.barracks&&factions[t.owner].alive) addUnits(t,'inf',1);
  checkMissions(); panelDirty=true;
}
const enemyNb=(t,fid)=>[...t.adj].map(i=>terrs[i]).filter(n=>n.owner!==fid);
const defPower=t=>t.battle?99:power(t.units)*(1+.3*t.trench)+.5;
function aiThink(f){
  const mine=terrs.filter(t=>t.owner===f.id); if(!mine.length) return;
  for(const t of mine){ let e=0; for(const n of enemyNb(t,f.id)) e+=power(n.units); t._th=e*.6-power(t.units)*(1+.3*t.trench)+(t.battle?8:0); }
  const border=mine.filter(t=>enemyNb(t,f.id).length);
  let guard=50;
  while(f.supply>=1&&guard-->0&&border.length){
    const facs=mine.filter(t=>t.factory).length, bars=mine.filter(t=>t.barracks).length;
    if(f.supply>=COST.factory+2&&facs<1+Math.floor(mine.length/5)&&rand()<.4){ const c=mine.filter(t=>!t.factory).sort((a,b)=>a._th-b._th)[0]; if(c&&!build(f.id,c,'factory')) continue; }
    if(f.supply>=COST.barracks+1&&bars<Math.floor(mine.length/6)&&rand()<.25){ const c=mine.filter(t=>!t.barracks).sort((a,b)=>a._th-b._th)[0]; if(c&&!build(f.id,c,'barracks')) continue; }
    let tgt=null,bs=-1e9; for(const t of border){ const s=t._th+rand()*3+(t.capitalOf===f.id?4:0)+(enemyNb(t,f.id).some(n=>missionWants(f,n))?2:0); if(s>bs){bs=s;tgt=t;} }
    if(tgt._th>4&&tgt.trench<3&&f.supply>=TRENCH_COST[tgt.trench]&&rand()<.22){ build(f.id,tgt,'trench'); continue; }
    const r=rand(); let type='inf';
    if(tgt.factory&&f.supply>=5&&r<.22) type='tank'; else if(f.supply>=3&&r<.45) type='art'; else if(f.supply>=2&&r<.65) type='mg';
    if(recruit(f.id,tgt,type)) break;
    tgt._th-=UT[type].power;
  }
  let attacks=0;
  for(const t of mine.filter(t=>!t.battle).sort((a,b)=>power(b.units)-power(a.units))){
    if(attacks>=2) break; if(total(t.units)<3) continue;
    const avail=power(t.units)*.85; let best=null,bs=-1e9;
    for(const n of enemyNb(t,f.id)){
      if(armies.some(a=>a.owner===f.id&&a.to===n.id)) continue;
      const margin=avail-defPower(n)*1.3-1.5; if(margin<=0) continue;
      const s=margin+(missionWants(f,n)?6:0)+(n.capitalOf>=0?3:0)-defPower(n)*.2+rand()*2;
      if(s>bs){bs=s;best=n;} }
    if(best&&!sendArmy(f.id,t.id,best.id,.85)) attacks++;
  }
  // move idle interior troops toward the front
  const dist={}; const q=[]; for(const t of border){dist[t.id]=0;q.push(t);}
  for(let h=0;h<q.length;h++){ const t=q[h]; for(const j of t.adj){ const n=terrs[j]; if(n.owner===f.id&&dist[j]===undefined){dist[j]=dist[t.id]+1;q.push(n);} } }
  for(const t of mine){ if(t.battle||!dist[t.id]||total(t.units)<2) continue;
    const n=[...t.adj].map(j=>terrs[j]).filter(n=>n.owner===f.id&&dist[n.id]<dist[t.id])[0]; if(n) sendArmy(f.id,t.id,n.id,1); }
}

/* =========================================================
   simulation step
   ========================================================= */
function step(dt){
  G.time+=dt; G.supplyT+=dt;
  if(G.supplyT>=TICK){ G.supplyT-=TICK; supplyTick(); }
  for(let i=armies.length-1;i>=0;i--){ const a=armies[i]; a.t+=dt/a.dur; if(a.t>=1){ armies.splice(i,1); arrive(a); panelDirty=true; } }
  for(const b of battles) stepBattle(b,dt);
  for(let i=battles.length-1;i>=0;i--) if(battles[i].ended&&G.time>battles[i].removeAt){ disposeBattle(battles[i]); battles.splice(i,1); }
  for(const f of factions){ if(!f.alive||f.id===G.player) continue; f.aiT-=dt; if(f.aiT<=0){ f.aiT=2.5+rand()*1.8; aiThink(f); } }
  for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.life+=dt; if(p.life>=p.max){ parts[i]=parts[parts.length-1]; parts.pop(); continue; }
    p.vy-=p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.z+=p.vz*dt; if(p.floor!==undefined&&p.y<p.floor){p.y=p.floor;p.vx*=.4;p.vz*=.4;p.vy=0;} }
  if(parts.length>3500) parts.splice(0,parts.length-3500);
  for(let i=tracers.length-1;i>=0;i--){ tracers[i].life+=dt; if(tracers[i].life>=tracers[i].max) tracers.splice(i,1); }
  // factory smoke
  if(Math.floor(G.time*2)!==Math.floor((G.time-dt)*2)) for(const t of terrs) if(t.factory&&!t.battle&&rand()<.7){ const y=tileH[t.anchor];
    parts.push({x:t.cx+1.1,y:y+.55,z:t.cz-.5,vx:.06,vy:.25,vz:-.02,g:0,life:0,max:2.4,s:.12,s1:.34,c:K.smoke,map:true}); }
}

/* =========================================================
   camera & input
   ========================================================= */
const cam={tx:10,tz:-20,dist:70,gx:10,gz:-20,gdist:70};
const keys=new Set();
function updateCamera(dt){
  const sp=cam.dist*.9*dt;
  if(keys.has('w')||keys.has('arrowup')) cam.gz-=sp; if(keys.has('s')||keys.has('arrowdown')) cam.gz+=sp;
  if(keys.has('a')||keys.has('arrowleft')) cam.gx-=sp; if(keys.has('d')||keys.has('arrowright')) cam.gx+=sp;
  cam.gx=clamp(cam.gx,-COLS/2,COLS/2); cam.gz=clamp(cam.gz,-ROWS/2,ROWS/2);
  const k=1-Math.exp(-dt*7);
  cam.tx=lerp(cam.tx,cam.gx,k); cam.tz=lerp(cam.tz,cam.gz,k); cam.dist=lerp(cam.dist,cam.gdist,k);
  const pitch=lerp(.66,1.08,smooth(3,70,cam.dist));
  camera.position.set(cam.tx,cam.dist*Math.sin(pitch),cam.tz+cam.dist*Math.cos(pitch));
  camera.lookAt(cam.tx,.5,cam.tz); camera.updateMatrixWorld();
}
function flyTo(t,d){ cam.gx=t.cx; cam.gz=t.cz; if(d) cam.gdist=d; }
const ray=new THREE.Raycaster(), plane=new THREE.Plane(new THREE.Vector3(0,1,0),-.55), ndc=new THREE.Vector2(), hitV=new THREE.Vector3();
function screenToWorld(x,y){ const r=canvas.getBoundingClientRect(); ndc.set((x-r.left)/r.width*2-1,-(y-r.top)/r.height*2+1); ray.setFromCamera(ndc,camera); return ray.ray.intersectPlane(plane,hitV)?hitV.clone():null; }
function terrAt(x,y){ const p=screenToWorld(x,y); if(!p) return -1; const c=Math.floor(p.x+COLS/2), r=Math.floor(p.z+ROWS/2); if(c<0||c>=COLS||r<0||r>=ROWS) return -1; const i=r*COLS+c; return land[i]?terrOf[i]:-1; }

const ptrs=new Map(); let down=null, dragging=false, pinch=0;
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('pointerdown',e=>{
  canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){ down={x:e.clientX,y:e.clientY,b:e.button}; dragging=false; }
  if(ptrs.size===2){ const [p,q]=[...ptrs.values()]; pinch=Math.hypot(p.x-q.x,p.y-q.y); dragging=true; }
});
canvas.addEventListener('pointermove',e=>{
  const prev=ptrs.get(e.pointerId);
  if(!prev){ const id=terrAt(e.clientX,e.clientY); if(id!==G.hover){ const o=G.hover; G.hover=id; if(o>=0) paintTerr(terrs[o]); if(id>=0) paintTerr(terrs[id]); } return; }
  const cur={x:e.clientX,y:e.clientY};
  if(ptrs.size===2){ ptrs.set(e.pointerId,cur); const [p,q]=[...ptrs.values()]; const d=Math.hypot(p.x-q.x,p.y-q.y); if(pinch>0){ cam.gdist=clamp(cam.gdist*pinch/d,2.5,170); } pinch=d; return; }
  if(down&&(down.b===0||down.b===1)){
    if(!dragging&&Math.hypot(cur.x-down.x,cur.y-down.y)>6){ dragging=true; canvas.classList.add('drag'); }
    if(dragging){ const a=screenToWorld(prev.x,prev.y), b=screenToWorld(cur.x,cur.y); if(a&&b){ const dx=a.x-b.x, dz=a.z-b.z; cam.gx+=dx; cam.gz+=dz; cam.tx+=dx; cam.tz+=dz; } }
  }
  ptrs.set(e.pointerId,cur);
});
function endPtr(e){
  if(!ptrs.has(e.pointerId)) return;
  if(ptrs.size===1&&down&&!dragging){ const id=terrAt(e.clientX,e.clientY);
    if(down.b===2||(down.b===0&&G.orderMode)) order(id); else if(down.b===0) select(id); }
  ptrs.delete(e.pointerId); if(!ptrs.size){ down=null; dragging=false; canvas.classList.remove('drag'); }
}
canvas.addEventListener('pointerup',endPtr); canvas.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId); if(!ptrs.size){down=null;dragging=false;}});
canvas.addEventListener('dblclick',e=>{ const id=terrAt(e.clientX,e.clientY); if(id<0) return; const t=terrs[id]; flyTo(t,t.battle?7.5:Math.min(cam.gdist,28)); });
canvas.addEventListener('wheel',e=>{ e.preventDefault(); const f=Math.exp(clamp(e.deltaY,-120,120)*.0018); const p=screenToWorld(e.clientX,e.clientY);
  const nd=clamp(cam.gdist*f,2.5,170), ff=nd/cam.gdist; cam.gdist=nd; if(p){ cam.gx=p.x+(cam.gx-p.x)*ff; cam.gz=p.z+(cam.gz-p.z)*ff; } },{passive:false});
addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('input,textarea')) return;
  const k=e.key.toLowerCase(); keys.add(k);
  if(!G.running) return;
  if(k===' '){ e.preventDefault(); setSpeed(G.speed?0:1); }
  if(k==='escape'){ G.orderMode=false; canvas.classList.remove('order'); select(-1); }
  const t=terrs[G.sel]; const map={'1':'inf','2':'mg','3':'art','4':'tank'};
  if(map[k]&&t){ const err=recruit(G.player,t,map[k]); if(err) toast(err); panelDirty=true; }
});
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
addEventListener('blur',()=>keys.clear());

function select(id){
  const o=G.sel; G.sel=id; G.orderMode=false; canvas.classList.remove('order');
  if(o>=0) paintAround(o); if(id>=0) paintAround(id);

function order(id){
  G.orderMode=false; canvas.classList.remove('order');

  const t=terrs[id]; const a=armies[armies.length-1];

   drawing
   ========================================================= */
const v3=new THREE.Vector3();
function draw(){
  lit.begin(); glow.begin(); nl=0;
  const near=cam.dist<26;
  // region pieces & works
  for(const t of terrs){
    const y=tileTop(t.anchor), x=t.cx, z=t.cz, f=t.owner;
    if(t.capitalOf>=0&&t.capitalOf===f){ part(x,y,z,0,-.2,.45,-.55,.04,.9,.04,K.pole); const w=Math.sin(G.time*3+t.id)*.02;
      part(x,y,z,0,.0,.8+w,-.55,.36,.22,.03,facCol[f]); }
    else if(t.capitalOf>=0){ part(x,y,z,0,-.2,.3,-.55,.04,.6,.04,K.pole); }
    if(t.battle&&near) continue;
    if(t.factory){ part(x,y,z,0,.95,.15,-.35,.5,.3,.38,K.brick); part(x,y,z,0,.82,.34,-.35,.2,.08,.38,K.brick2); part(x,y,z,0,1.08,.34,-.35,.2,.08,.38,K.brick2); part(x,y,z,0,1.1,.3,-.5,.1,.6,.1,K.brick2); }
    if(t.barracks){ part(x,y,z,0,-.95,.08,-.3,.6,.16,.3,K.bar); part(x,y,z,0,-.95,.19,-.3,.64,.06,.34,K.roof); }
    for(let k=0;k<t.trench*4;k++){ const lx=-.55+(k%6)*.22, lz=.48+Math.floor(k/6)*.14; part(x,y,z,0,lx,.035,lz,.16,.07,.1,K.sand); }
    if(t.battle) continue;
    const tot=total(t.units); if(!tot) continue;
    const S=3.2, n=tot>=15?3:tot>=6?2:1, offs=n===1?[[0,0]]:n===2?[[-.2,.02],[.2,-.04]]:[[-.32,.04],[0,-.08],[.32,.04]];
    for(const [ox,oz] of offs) drawSoldier(x+ox,y,z+oz,0,f,S,false,0);
    if(t.units.tank) drawUnit('tank',x+.62,y,z+.18,-.4,f,2.4,0);
    if(t.units.art) drawUnit('art',x-.62,y,z+.18,.35,f,2.4,0);
  }
  // marching armies
  for(const a of armies){
    const [x,z]=armyPos(a), y=lerp(a.y0,a.y1,a.t)+Math.sin(a.t*Math.PI)*.5, face=Math.atan2(a.dx,a.dz);
    const bob=Math.abs(Math.sin(G.time*10))*.05;
    drawSoldier(x-.18*Math.cos(face),y,z+.18*Math.sin(face),face,a.owner,3,false,bob);
    drawSoldier(x+.18*Math.cos(face),y,z-.18*Math.sin(face),face,a.owner,3,false,Math.abs(Math.sin(G.time*10+1.5))*.05);
    const fc=facCol[a.owner]; let px=x,pz=z; const B=terrs[a.to], rem=1-a.t, steps=Math.ceil(rem*Math.hypot(a.dx,a.dz)/.8);
    for(let s=0;s<steps;s++){ const t0=a.t+(s/steps)*rem, t1=a.t+((s+.5)/steps)*rem; let x0=a.ax+a.dx*t0, x1=a.ax+a.dx*t1;
      if(x0<-COLS/2) x0+=COLS; if(x0>COLS/2) x0-=COLS; if(x1<-COLS/2) x1+=COLS; if(x1>COLS/2) x1-=COLS;
      if(Math.abs(x1-x0)<5) line(x0,.62,a.az+a.dz*t0,x1,.62,a.az+a.dz*t1,fc); }
  }
  // battles up close
  const fade=1-smooth(16,26,cam.dist);
  for(const b of battles){
    const vis=Math.hypot(b.cx-cam.tx,b.cz-cam.tz)<16;
    b.mesh.material.opacity=vis?fade:0; b.mesh.visible=vis&&fade>.02;
    if(!b.mesh.visible) continue;
    for(const a of b.agents){
      const [wx,wz]=wpos(b,a.x,a.z);
      if(a.dead){ if(G.time-a.dieT<40){ if(a.type==='tank'){ drawUnit('tank',wx,b.y,wz,a.face,a.f,1,0); } else part(wx,b.y,wz,a.face+.4,0,.014,0,.075,.028,.17,DEADC[a.f]); } continue; }
      drawUnit(a.type,wx,b.y,wz,a.face,a.f,1,a.moving?Math.abs(Math.sin(a.phase))*.012:0);
    }
  }
  for(const p of parts){
    if(p.map&&near) continue;
    const k=p.life/p.max, s=lerp(p.s,p.s1,k);
    (p.glow?glow:lit).push(p.x,p.y,p.z,s,s,s,p.life*2,p.c);
  }
  for(const t of tracers) line(t.x0,t.y0,t.z0,t.x1,t.y1,t.z1,K.tracer);
  lit.end(); glow.end();
  lineGeo.setDrawRange(0,nl*2); lineGeo.attributes.position.needsUpdate=true; lineGeo.attributes.color.needsUpdate=true;
  waterMat.uniforms.uTime.value=G.time+performance.now()/4000;
}

function updatePowers(){
  const rows=factions.map(f=>{ const n=terrs.filter(t=>t.owner===f.id); const u=n.reduce((s,t)=>s+total(t.units),0)+armies.filter(a=>a.owner===f.id).reduce((s,a)=>s+total(a.units),0)+battles.reduce((s,b)=>s+(b.ended?0:b.agents.filter(a=>!a.dead&&a.f===f.id).length),0);
    return `<tr class="${f.id===G.player?'me':''} ${f.alive?'':'dead'}"><td><i class="chip" style="--c:${f.color}"></i> ${f.short}</td><td class="n">${n.length}</td><td class="n">${u}</td><td class="n">${f.alive?'+'+income(f.id):'—'}</td></tr>`; }).join('');
  const conts=Object.entries(CONT).map(([k,c])=>{ const h=factions.find(f=>ownsCont(f.id,k)); return `<tr><td>${c.name}</td><td class="n">+${c.bonus}</td><td class="n" colspan="2">${h?`<i class="chip" style="--c:${h.color}"></i>`:'<span style="color:var(--muted)">split</span>'}</td></tr>`; }).join('');
  powersEl.innerHTML=`<div class="lbl">Powers</div><table><tr class="hd"><td></td><td class="n">REG</td><td class="n">UNITS</td><td class="n">INCOME</td></tr>${rows}</table><div class="lbl">Continents</div><table>${conts}</table>`;
}
function renderLog(){ $('#log-list').innerHTML=logs.slice(0,5).map(l=>`<li class="${l.cls}"><time>${l.d}</time>${l.text}</li>`).join(''); }
function updateTop(){
  const f=factions[G.player];
  $('#tb-sup').textContent=f.supply; $('#tb-inc').textContent='+'+income(f.id)+' per convoy';
  $('#tb-sec').textContent=Math.ceil(TICK-G.supplyT)+'s'; $('#tb-bar').style.width=(G.supplyT/TICK*100)+'%'; $('#tb-date').textContent=dateStr();
}
function updateBattleCard(){
  const el=$('#bcard'); if(cam.dist>26){ el.hidden=true; return; }
  let b=null,bd=12; for(const x of battles){ const d=Math.hypot(x.cx-cam.tx,x.cz-cam.tz); if(d<bd){bd=d;b=x;} }
  if(!b){ el.hidden=true; return; }
  el.hidden=false;
  const by={}; for(const a of b.agents){ by[a.f]=by[a.f]||{alive:0,all:0}; by[a.f].all++; if(!a.dead) by[a.f].alive++; }
  const st=b.ended?'Over':`${Math.floor(b.age)}s of fighting`;
  el.innerHTML=`<div class="lbl">Battle of <b>${b.t.name}</b><span>${st}</span></div>`+Object.entries(by).map(([f,v])=>`<div class="side" style="--c:${FACTIONS[f].color}"><span><i class="chip" style="--c:${FACTIONS[f].color}"></i> ${FACTIONS[f].short}${+f===b.t.owner?' (defending)':''}</span><span class="sb"><i style="width:${v.all?v.alive/v.all*100:0}%"></i></span><span>${v.alive}/${v.all}</span></div>`).join('');
}

/* =========================================================
   modals & game flow
   ========================================================= */
const modal=$('#modal'), sheet=$('#sheet');
function openModal(html){ sheet.innerHTML=html; modal.hidden=false; const b=sheet.querySelector('button'); b&&b.focus({preventScroll:true}); }
function closeModal(){ modal.hidden=true; }
function showStart(){
  G.running=false;
  openModal(`<div class="kicker">The world map · August 1914</div><h1>Fronts of 1914</h1>
  <p class="lede">Six great powers split the world between them. Supply convoys arrive for every power at the same moment, every ${TICK} seconds. Spend it on troops and works, then march on your neighbours. Battles fight themselves. Scroll in on one to watch it.</p>
  <div class="lbl">Choose your power</div>
  <div class="picks">${FACTIONS.map((f,i)=>`<button class="pick" data-pick="${i}" style="--c:${f.color}"><i></i><b>${f.name}</b><span>Capital: ${f.capital}</span></button>`).join('')}</div>`);
  sheet.querySelectorAll('[data-pick]').forEach(b=>b.addEventListener('click',()=>{ newGame(+b.dataset.pick); showOrders(true); }));
}
function progressHtml(f){
  const m=f.mission, mine=terrs.filter(t=>t.owner===f.id);
  const cp=k=>{ const all=terrs.filter(t=>t.cont===k); return `<span>${CONT[k].name} <b>${all.filter(t=>t.owner===f.id).length}/${all.length}</b></span>`; };
  if(m.type==='conts'||m.type==='conts1') return m.conts.map(cp).join('')+(m.type==='conts1'?'<span>plus one more continent</span>':'');
  if(m.type==='count') return `<span>Regions held <b>${mine.length}/${m.n}</b></span>`;
  if(m.type==='count2') return `<span>Regions with 2+ units <b>${mine.filter(t=>total(t.units)>=2).length}/${m.n}</b></span>`;
  if(m.type==='destroy'){ const n=terrs.filter(t=>t.owner===m.target).length; return `<span>${factions[m.target].name} regions left <b>${n}</b></span>`; }
}
function showOrders(first){
  const f=factions[G.player]; if(!f.mission) return;
  const [title,text]=missionText(f.mission);
  const prevSpeed=G.speed; if(!first) G.running=false;
  openModal(`<div class="kicker">${f.name} · War Office</div>
   <div class="orders"><span class="stamp">SECRET</span><h2>${title}</h2><p>${text}</p><div class="prog">${progressHtml(f)}</div></div>
   <p class="hint">Every other power has its own sealed orders. The first to complete theirs wins the war.</p>
   <div class="row"><button class="btn" id="m-go">${first?'Open hostilities':'Back to the map'}</button>${first?'<button class="btn" id="m-help">How to play</button>':''}</div>`);
  $('#m-go').addEventListener('click',()=>{ closeModal(); G.running=true; G.started=true; if(first){ setSpeed(1); log('War is declared. Sealed orders received.','me'); } });
  $('#m-help')?.addEventListener('click',showHelp);
}
function showHelp(){
  const was=G.running; G.running=false;
  openModal(`<div class="kicker">Field manual</div><h2>How to play</h2>
  <dl class="keys">
   <dt>Click</dt><dd>Select a region to open its file: garrison, works, recruiting.</dd>
   <dt>Right-click</dt><dd>With your region selected, march its troops into a bordering region. Dashed sea lanes count as borders.</dd>
   <dt>Drag · wheel</dt><dd>Pan and zoom. Zoom close to a battle to see the troops fight. Double-click a region to fly to it.</dd>
   <dt>1 2 3 4</dt><dd>Recruit infantry, machine gun, field gun or tank in the selected region.</dd>
   <dt>Space</dt><dd>Pause or resume. WASD or arrow keys also pan.</dd>
  </dl>
  <p>Every ${TICK} seconds a convoy arrives: 1 supply per 3 regions (at least 3), plus continent bonuses and +2 per factory. Field guns outrange everything; machine guns pin attackers; tanks shrug off rifle fire. Trenches cut the damage defenders take.</p>
  <div class="row"><button class="btn" id="m-close">${G.started?'Back to the map':'Back'}</button></div>`);
  $('#m-close').addEventListener('click',()=>{ if(G.started){ closeModal(); G.running=was||G.started; } else showOrders(true); });
}
function endGame(winner,why){
  if(G.over) return; G.over=true; G.running=false;
  const won=winner===G.player, W=winner!==null?factions[winner]:null;
  const text=why||(won?`Your sealed orders are fulfilled: ${missionText(factions[G.player].mission)[0].toLowerCase()}.`:`${cap(W.the)} has fulfilled its sealed orders: ${missionText(W.mission)[0].toLowerCase()}.`);
  openModal(`<div class="kicker">${dateStr()}</div><h1>${won?'Victory':'Defeat'}</h1><p class="lede">${text}</p><div class="row"><button class="btn" id="m-new">Start a new war</button><button class="btn" id="m-look">Look at the map</button></div>`);
  $('#m-new').addEventListener('click',showStart);
  $('#m-look').addEventListener('click',closeModal);
}
function newGame(pid){
  battles.forEach(disposeBattle); battles.length=0; armies.forEach(a=>a.el.remove()); armies.length=0; parts.length=0; tracers.length=0; logs.length=0;
  Object.assign(G,{time:0,day:0,supplyT:0,over:false,player:pid,sel:-1,hover:-1,orderMode:false,started:false});
  factions.forEach(f=>{ f.supply=5; f.alive=true; f.aiT=1.5+rand()*2; });
  terrs.forEach(t=>{ t.owner=-1; t.units=emptyU(); t.trench=0; t.factory=false; t.barracks=false; t.capitalOf=-1; t.battle=null; });
  factions.forEach(f=>{ const t=byName[f.capital]; t.owner=f.id; t.capitalOf=f.id; t.units={inf:6,mg:2,art:1,tank:0}; t.trench=2; t.factory=true; });
  const rest=shuffle(terrs.filter(t=>t.owner<0)), off=Math.floor(rand()*6);
  rest.forEach((t,k)=>{ t.owner=(k+off)%6; t.units.inf=2+(rand()<.5?1:0); });
  const pool=shuffle(buildMissions());
  factions.forEach(f=>{ const i=pool.findIndex(m=>!(m.type==='destroy'&&m.target===f.id)); f.mission=pool.splice(i,1)[0]; });
  paintAll(); renderLog(); panelKey=''; panelDirty=true;
  flyTo(byName[factions[pid].capital],48);
  $('#crest').style.setProperty('--c',FACTIONS[pid].color); $('#crest').textContent=FACTIONS[pid].key; $('#tb-name').textContent=FACTIONS[pid].name;
}

/* =========================================================
   boot
   ========================================================= */
resize();
// demo board behind the title screen
factions.forEach(f=>f.mission={type:'count',n:30});
newGame(0);
cam.tx=cam.gx=15; cam.tz=cam.gz=-18; cam.dist=cam.gdist=80;
showStart();
let last=performance.now(), uiT=0;
function frame(now){
  requestAnimationFrame(frame);
  const rdt=Math.min(.05,(now-last)/1000); last=now;
  if(G.running&&!G.over&&G.speed>0){ let g=rdt*G.speed; while(g>1e-6){ const s=Math.min(g,.05); step(s); g-=s; } }
  updateCamera(rdt); draw(); renderer.render(scene,camera); updateLabels();
  uiT+=rdt; if(uiT>.2||panelDirty){ uiT=0; panelDirty=false; updateTop(); updatePanel(); updatePowers(); updateBattleCard(); }
}
requestAnimationFrame(frame);
window.__G={G,terrs,factions,battles,armies,cam,step,sendArmy,flyTo,select};
</script>
