<title>Fronts of 1914</title>
<meta name="description" content="Real-time Risiko-style World War I strategy with auto-battles.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: full-bleed 3D map. Modern HUD in four calm zones:
   top (orders · supply · clock), right (selected region), bottom-left (events + minimap), bottom-centre (hint). */
:root{
  --bg:#0a0d0f;
  --glass:rgba(17,21,24,.8);
  --glass-hi:rgba(28,34,38,.9);
  --tint:rgba(255,255,255,.055);
  --line:rgba(255,255,255,.09);
  --line-2:rgba(255,255,255,.18);
  --fg:#efeadc;
  --mute:#a1a79a;
  --dim:#6f766b;
  --accent:#e6b85c;
  --accent-ink:#1d1506;
  --danger:#f0705c;
  --ok:#8fd07d;
  --f-head:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --f-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 14px/1.4 var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
#app{position:fixed;inset:0;overflow:hidden;user-select:none;-webkit-user-select:none}
#view{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none;cursor:grab}
#view.smooth{image-rendering:auto}
#view.drag{cursor:grabbing}
#view.order{cursor:crosshair}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}

.glass{background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(1.25);backdrop-filter:blur(14px) saturate(1.25);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 34px rgba(0,0,0,.38)}
small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600}
kbd{font:600 11px var(--f-body);background:var(--tint);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--fg);margin-left:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:38px;padding:8px 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--tint);cursor:pointer;font-weight:600;font-size:14px;transition:background .12s,border-color .12s,transform .06s}
.btn:hover:not(:disabled){background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.3)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){background:#f2c775;border-color:#f2c775}
.btn.sm{min-height:30px;padding:4px 12px;font-size:13px}
.btn.wide{width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- top ---------- */
#top{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:start;pointer-events:none}
#top>*{pointer-events:auto}
.mission{justify-self:start;display:flex;align-items:center;gap:12px;padding:8px 14px 8px 8px;cursor:pointer;text-align:left;max-width:100%;min-width:0}
.mission:hover{border-color:var(--line-2)}
.crest{width:40px;height:40px;border-radius:10px;background:var(--c,#666);display:grid;place-items:center;color:#0b0e10;font:700 16px var(--f-head);letter-spacing:.04em;flex:none}
.mtx{display:flex;flex-direction:column;gap:3px;min-width:0}
.mtx b{font:600 18px/1.05 var(--f-head);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
.mbar{height:3px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
.mbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .6s}
.center{display:flex;flex-direction:column;align-items:center;gap:8px}
.res{display:flex;align-items:center;gap:14px;padding:8px 18px 8px 10px}
.res.pulse{animation:pulse .9s ease-out}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(230,184,92,.7),0 10px 34px rgba(0,0,0,.38)}100%{box-shadow:0 0 0 22px rgba(230,184,92,0),0 10px 34px rgba(0,0,0,.38)}}
.ring{--p:0%;width:46px;height:46px;border-radius:50%;background:conic-gradient(var(--accent) var(--p),rgba(255,255,255,.13) 0);display:grid;place-items:center;position:relative;flex:none}
.ring::before{content:"";position:absolute;inset:4px;border-radius:50%;background:#14181b}
.ring span{position:relative;font:600 16px var(--f-head);font-variant-numeric:tabular-nums}
.rv{display:flex;flex-direction:column;line-height:1}
.rv b{font:600 38px/.95 var(--f-head);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.ri{display:flex;flex-direction:column;gap:2px}
.ri span{font:600 18px var(--f-head);color:var(--ok)}
.pills{display:flex;gap:2px;padding:4px;border-radius:999px}
.pill{display:flex;align-items:center;gap:6px;border:0;background:transparent;border-radius:999px;padding:4px 10px 4px 6px;cursor:pointer;font:600 14px var(--f-head);letter-spacing:.02em}
.pill i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.pill:hover{background:var(--tint)}
.pill.me{background:rgba(255,255,255,.09)}
.pill.dead{opacity:.35;text-decoration:line-through}
.right{justify-self:end}
.clock{display:flex;align-items:center;gap:12px;padding:6px 6px 6px 16px}
#date{font:600 17px var(--f-head);letter-spacing:.03em;white-space:nowrap}
.seg{display:flex;gap:2px;background:rgba(0,0,0,.28);border-radius:10px;padding:2px}
.seg button{border:0;background:transparent;border-radius:8px;min-width:34px;min-height:30px;padding:0 8px;font:600 13px var(--f-body);color:var(--mute);cursor:pointer}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed=true],.seg button.on{background:var(--accent);color:var(--accent-ink)}
.ico{width:38px;height:38px;border-radius:10px;border:0;background:var(--tint);cursor:pointer;display:grid;place-items:center;font-size:20px;line-height:1}
.ico:hover{background:rgba(255,255,255,.12)}
#score{position:absolute;top:calc(118px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(400px,calc(100% - 24px));padding:14px 16px;display:flex;flex-direction:column;gap:10px}
#score table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
#score th{font:600 11px var(--f-body);letter-spacing:.08em;color:var(--mute);text-align:right;padding:0 0 6px;text-transform:uppercase}
#score th:first-child,#score td:first-child{text-align:left}
#score td{padding:5px 0;text-align:right;font:600 16px var(--f-head);border-top:1px solid var(--line)}
#score td:first-child{display:flex;gap:8px;align-items:center;font-family:var(--f-body);font-weight:500;font-size:14px}
#score tr.me td{color:var(--accent)}
#score tr.dead td{color:var(--dim);text-decoration:line-through}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none;display:inline-block}
.cont{display:flex;flex-wrap:wrap;gap:6px}
.cont span{display:flex;align-items:center;gap:6px;background:var(--tint);border-radius:8px;padding:4px 8px;font-size:12px}
.cont b{font-family:var(--f-head);font-size:14px;color:var(--accent)}

#toast{position:absolute;left:50%;top:calc(124px + env(safe-area-inset-top,0px));transform:translateX(-50%);padding:10px 18px;max-width:calc(100% - 24px);text-align:center;font-weight:500;border-color:rgba(230,184,92,.5);pointer-events:none;z-index:5}
#toast.in{animation:tin .22s ease-out}
@keyframes tin{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}

/* ---------- region drawer ---------- */
#drawer{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:calc(84px + env(safe-area-inset-top,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:340px;display:flex;flex-direction:column;overflow:hidden;animation:slide .2s ease-out}
@keyframes slide{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.dh{padding:14px 16px 12px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 22%,transparent),transparent);position:relative}
.dh::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.dh-row{display:flex;justify-content:space-between;align-items:center;min-height:22px}
.dh h2{margin:2px 0 4px;font:700 32px/1 var(--f-head);letter-spacing:.01em;text-wrap:balance}
.owner{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:13px}
.owner::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.badge{background:var(--accent);color:var(--accent-ink);font:700 10px var(--f-body);letter-spacing:.08em;text-transform:uppercase;border-radius:5px;padding:2px 6px}
.x{width:30px;height:30px;border-radius:8px;border:0;background:transparent;color:var(--mute);cursor:pointer;display:grid;place-items:center;margin-right:-6px}
.x:hover{background:var(--tint);color:var(--fg)}
.x svg{width:14px;height:14px}
.alert{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:rgba(240,112,92,.14);border-bottom:1px solid rgba(240,112,92,.3);color:#ffd2c9;font-size:13px}
.gar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:14px 16px 8px}
.gt{background:var(--tint);border:1px solid var(--line);border-radius:10px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:1px}
.gt svg{width:24px;height:24px;color:var(--mute)}
.gt b{font:600 26px/1 var(--f-head);font-variant-numeric:tabular-nums}
.gt small{font-size:10px}
.works{display:flex;flex-wrap:wrap;gap:6px;padding:4px 16px 14px;align-items:center}
.wk{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:rgba(143,208,125,.14);color:var(--ok);border:1px solid rgba(143,208,125,.28)}
.wk.off{background:transparent;color:var(--dim);border-color:var(--line);font-weight:500}
.str{margin-left:auto;font-size:12px;color:var(--mute)}
.str b{font:600 16px var(--f-head);color:var(--fg)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.tab{border:0;background:transparent;padding:11px 0 10px;font:600 13px var(--f-body);letter-spacing:.04em;color:var(--mute);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--fg)}
.tab[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent)}
.tb-body{overflow:auto;padding:8px 10px 12px;display:flex;flex-direction:column;gap:2px;flex:1;min-height:0}
.it{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 6px;border-radius:10px}
.it:hover{background:var(--tint)}
.it .ic{width:34px;height:34px;border-radius:9px;background:var(--tint);display:grid;place-items:center;color:var(--accent)}
.it .ic svg{width:22px;height:22px}
.it .tx{display:flex;flex-direction:column;min-width:0}
.it .tx b{font-weight:600;font-size:14px}
.it .tx small{text-transform:none;letter-spacing:0;font-size:12px;font-weight:400;color:var(--mute)}
.pips{letter-spacing:2px;color:var(--accent);font-size:11px;margin-left:6px}
.buy{display:inline-flex;align-items:center;gap:6px;min-width:70px;justify-content:center;padding:7px 12px;border-radius:9px;border:1px solid rgba(230,184,92,.55);background:rgba(230,184,92,.12);color:var(--accent);font:600 15px var(--f-head);letter-spacing:.02em;cursor:pointer;white-space:nowrap}
.buy:hover:not(:disabled){background:var(--accent);color:var(--accent-ink)}
.buy:disabled{opacity:.35;cursor:not-allowed;border-color:var(--line-2);color:var(--mute);background:transparent}
.buy.atk{border-color:rgba(240,112,92,.6);background:rgba(240,112,92,.12);color:var(--danger);font-family:var(--f-body);font-size:13px}
.buy.atk:hover:not(:disabled){background:var(--danger);color:#1d0a06}
.buy.plain{font-family:var(--f-body);font-size:13px}
i.sup{display:inline-block;width:11px;height:11px;border:2px solid currentColor;border-radius:2px;position:relative}
i.sup::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;margin-left:-1px;background:currentColor}
.lbl{font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding:10px 6px 4px;display:flex;justify-content:space-between}
.note{margin:6px 6px 0;color:var(--mute);font-size:12px}
.nb .dot{margin:0 12px}
.pad{padding:10px 16px 16px;display:flex;flex-direction:column;gap:6px;overflow:auto}

/* ---------- left column ---------- */
#leftcol{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:272px;display:flex;flex-direction:column;gap:10px;pointer-events:none}
#feed{display:flex;flex-direction:column;gap:6px}
.fi{pointer-events:auto;background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--line);border-left:3px solid var(--line-2);border-radius:10px;padding:7px 10px;font-size:13px;line-height:1.3;animation:fin .25s ease-out,fout .6s 9.2s forwards}
.fi time{display:block;font:600 10px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.fi.me{border-left-color:var(--accent)}
.fi.bad{border-left-color:var(--danger)}
.fi.good{border-left-color:var(--ok)}
.fi.go{cursor:pointer}
.fi.go:hover{background:var(--glass-hi)}
@keyframes fin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fout{to{opacity:0;transform:translateX(-12px)}}
.mini{pointer-events:auto;padding:5px;border-radius:12px;line-height:0}
#mini{width:100%;height:auto;border-radius:8px;cursor:crosshair;touch-action:none;display:block}

/* ---------- bottom centre ---------- */
#bottom{position:absolute;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;width:min(560px,calc(100% - 24px));pointer-events:none}
#hint{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 16px;border-radius:999px;font-size:13.5px;color:var(--fg);max-width:100%}
#hint[hidden]{display:none}
#hint b{color:var(--accent);font-weight:600}
#hint-x{border:0;background:transparent;color:var(--dim);width:24px;height:24px;border-radius:50%;cursor:pointer;line-height:1;font-size:16px}
#hint-x:hover{background:var(--tint);color:var(--fg)}
#bcard{pointer-events:auto;width:100%;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
#bcard .bt{display:flex;justify-content:space-between;align-items:baseline}
#bcard .bt b{font:700 20px var(--f-head);letter-spacing:.02em}
.side{display:grid;grid-template-columns:96px 1fr 56px;gap:10px;align-items:center;font-size:13px}
.side .nm{display:flex;align-items:center;gap:6px;white-space:nowrap}
.side .sb{height:8px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden}
.side .sb i{display:block;height:100%;background:var(--c);transition:width .3s}
.side .n{text-align:right;font:600 15px var(--f-head);font-variant-numeric:tabular-nums}

/* ---------- map labels ---------- */
.tl{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:3px;white-space:nowrap;will-change:transform}
.tl .n{background:var(--c);color:#0b0e10;border-radius:999px;padding:3px 8px 2px;min-width:26px;text-align:center;font:700 15px/1.05 var(--f-head);letter-spacing:.02em;box-shadow:0 0 0 2px rgba(8,10,12,.7),0 3px 8px rgba(0,0,0,.45)}
.tl .nm{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.95),0 0 2px #000,0 0 8px rgba(0,0,0,.6);font:600 11px/1 var(--f-body);letter-spacing:.09em;text-transform:uppercase}
.tl.sel .n{box-shadow:0 0 0 2px #fff,0 0 16px 3px var(--c)}
.tl.tg .n{box-shadow:0 0 0 2px var(--danger),0 0 14px 2px rgba(240,112,92,.7)}
.tl.ar .n{border-radius:7px;font-size:14px}
.tl.sm .n{font-size:11px;padding:2px 5px 1px;min-width:0;box-shadow:0 0 0 1.5px rgba(8,10,12,.7)}
.cl{position:absolute;left:0;top:0;font:500 11px/1 var(--f-body);letter-spacing:.04em;color:#f6f0dc;text-shadow:0 1px 3px rgba(0,0,0,.95),0 0 2px #000;white-space:nowrap;will-change:transform}
.cl.c3{font-size:13px;font-weight:600}
.bm{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;background:rgba(32,10,6,.88);border:1px solid var(--danger);color:#ffb3a5;padding:4px 10px 4px 8px;border-radius:999px;display:flex;align-items:center;gap:6px;font:600 12px var(--f-body);will-change:transform;box-shadow:0 0 0 0 rgba(240,112,92,.6);animation:ping 1.8s infinite}
.bm svg{display:block}
.bm:hover{background:rgba(70,20,12,.95)}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(240,112,92,.55)}80%,100%{box-shadow:0 0 0 14px rgba(240,112,92,0)}}

/* ---------- modals ---------- */
.scrim{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(6,8,9,.5),rgba(6,8,9,.84));-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:auto;z-index:10}
.sheet{width:min(760px,100%);padding:28px;display:flex;flex-direction:column;gap:18px;max-height:100%;overflow:auto;animation:tin2 .25s ease-out}
.sheet.narrow{width:min(480px,100%)}
@keyframes tin2{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.kicker{font:600 12px var(--f-body);letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
.sheet h1{margin:0;font:700 clamp(44px,8vw,84px)/.88 var(--f-head);letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.sheet h2{margin:0;font:700 30px/1 var(--f-head);letter-spacing:.01em;text-wrap:balance}
.lede{font-size:16px;line-height:1.55;color:#d9d5c6;max-width:62ch;margin:0}
.sheet p{margin:0;max-width:64ch}
.picks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pick{text-align:left;cursor:pointer;background:var(--tint);border:1px solid var(--line);border-radius:12px;padding:0;display:flex;flex-direction:column;overflow:hidden;transition:transform .1s,border-color .12s}
.pick:hover{border-color:var(--c);transform:translateY(-2px)}
.pick[aria-pressed=true]{border-color:var(--c);box-shadow:0 0 0 1px var(--c)}
.pick i{height:6px;background:var(--c);display:block}
.pick div{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.pick b{font:700 20px/1.05 var(--f-head);letter-spacing:.02em}
.pick span{color:var(--mute);font-size:12.5px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.orders{position:relative;border:1px solid rgba(230,184,92,.4);border-radius:12px;padding:20px;background:linear-gradient(180deg,rgba(230,184,92,.1),rgba(230,184,92,.03));display:flex;flex-direction:column;gap:10px}
.stamp{position:absolute;right:16px;top:14px;transform:rotate(6deg);border:2px solid var(--danger);color:var(--danger);font:700 14px var(--f-head);letter-spacing:.2em;padding:2px 10px 0;border-radius:4px;opacity:.85}
.prog{display:flex;flex-wrap:wrap;gap:8px}
.prog span{background:var(--tint);border-radius:8px;padding:5px 10px;font-size:13px;color:var(--mute)}
.prog b{color:var(--fg);font-family:var(--f-head);font-size:16px;margin-left:4px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;margin:0}
.keys dt{font-weight:600;color:var(--accent);white-space:nowrap}
.keys dd{margin:0;color:#d9d5c6}
.menu{display:flex;flex-direction:column;gap:8px}
.menu .grp{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 2px}
.hist{max-height:150px;overflow:auto;border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--mute)}
.hist time{color:var(--dim);margin-right:8px}
.hist .bad{color:#ffb3a5}.hist .good{color:var(--ok)}.hist .me{color:var(--fg)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats div{background:var(--tint);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column}
.stats b{font:700 30px/1 var(--f-head)}

@media (max-width:980px){
  .mtx b{max-width:170px}
  .pill{padding:4px 7px 4px 5px}
}
@media (max-width:760px){
  #top{grid-template-columns:minmax(0,1fr) auto;gap:8px}
  .center{grid-column:1/-1;grid-row:2}
  .mission{padding:6px 10px 6px 6px}
  .mtx b{max-width:34vw;font-size:16px}
  .crest{width:34px;height:34px}
  .clock{padding:4px 4px 4px 10px;gap:6px}
  #date{display:none}
  .rv b{font-size:30px}
  .res{padding:6px 12px 6px 8px}
  #score{top:calc(128px + env(safe-area-inset-top,0px))}
  #toast{top:calc(136px + env(safe-area-inset-top,0px))}
  #drawer{top:auto;left:8px;right:8px;width:auto;max-height:56%;bottom:calc(8px + env(safe-area-inset-bottom,0px))}
  .mini{display:none}
  #leftcol{width:min(250px,60vw);bottom:auto;top:calc(150px + env(safe-area-inset-top,0px))}
  #bottom{width:calc(100% - 16px)}
  .picks{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sheet{padding:20px}
  .stats{grid-template-columns:1fr}
  #app.has-drawer #bottom,#app.has-drawer #leftcol{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important}}

<div id="app">
  <canvas id="view" aria-label="World map of 1914"></canvas>
  <div id="labels" aria-hidden="true"></div>

  <header id="top">
    <button id="mission" class="glass mission" aria-label="Show sealed orders">
      <span class="crest" id="crest">GB</span>
      <span class="mtx"><small>Sealed orders</small><b id="m-title">—</b><span class="mbar"><i id="m-bar"></i></span></span>
    </button>
    <div class="center">
      <div id="res" class="glass res" title="Supply arrives for every power at the same moment">
        <div class="ring" id="ring"><span id="sup-s">20</span></div>
        <div class="rv"><small>Supply</small><b id="sup-n">0</b></div>
        <div class="ri"><span id="sup-inc">+0</span><small>per convoy</small></div>
      </div>
      <div id="pills" class="glass pills" role="group" aria-label="Powers"></div>
    </div>
    <div class="right">
      <div class="glass clock">
        <span id="date">1 Aug 1914</span>
        <div class="seg" role="group" aria-label="Game speed">
          <button data-speed="0" aria-label="Pause" aria-pressed="false">❚❚</button>
          <button data-speed="1" aria-pressed="true">1×</button>
          <button data-speed="2" aria-pressed="false">2×</button>
          <button data-speed="4" aria-pressed="false">4×</button>
        </div>
        <button id="b-menu" class="ico" aria-label="Menu">☰</button>
      </div>
    </div>
  </header>

  <div id="score" class="glass" hidden></div>
  <div id="toast" class="glass" hidden></div>
  <aside id="drawer" class="glass" hidden aria-live="polite"></aside>

  <div id="leftcol">
    <div id="feed" aria-live="polite"></div>
    <div class="glass mini"><canvas id="mini" width="520" height="204" aria-label="Minimap"></canvas></div>
  </div>

  <div id="bottom">
    <div id="bcard" class="glass" hidden></div>
    <div id="hint" class="glass"><span id="hint-t"></span><button id="hint-x" aria-label="Hide tips">×</button></div>
  </div>

  <div id="modal" class="scrim" hidden><div class="sheet glass" id="sheet"></div></div>
</div>

  const f=factions[fid];

function income(fid){
  const mine=terrs.filter(t=>t.owner===fid);
  let v=Math.max(3,Math.floor(mine.length/3));

  v+=2*mine.filter(t=>t.factory).length;
  return v;
}
function supplyTick(){
  G.day+=7;

  pulseSupply();

  checkMissions(); panelDirty=true;
}
const enemyNb=(t,fid)=>[...t.adj].map(i=>terrs[i]).filter(n=>n.owner!==fid);
const defPower=t=>t.battle?99:power(t.units)*(1+.3*t.trench)+.5;
function aiThink(f){
  const mine=terrs.filter(t=>t.owner===f.id); if(!mine.length) return;
  for(const t of mine){ let e=0; for(const n of enemyNb(t,f.id)) e+=power(n.units); t._th=e*.6-power(t.units)*(1+.3*t.trench)+(t.battle?8:0); }
  const border=mine.filter(t=>enemyNb(t,f.id).length);
  let guard=50;
  while(f.supply>=1&&guard-->0&&border.length){
    const facs=mine.filter(t=>t.factory).length, bars=mine.filter(t=>t.barracks).length;
    if(f.supply>=COST.factory+2&&facs<1+Math.floor(mine.length/5)&&rand()<.4){ const c=mine.filter(t=>!t.factory).sort((a,b)=>a._th-b._th)[0]; if(c&&!build(f.id,c,'factory')) continue; }
    if(f.supply>=COST.barracks+1&&bars<Math.floor(mine.length/6)&&rand()<.25){ const c=mine.filter(t=>!t.barracks).sort((a,b)=>a._th-b._th)[0]; if(c&&!build(f.id,c,'barracks')) continue; }
    let tgt=null,bs=-1e9; for(const t of border){ const s=t._th+rand()*3+(t.capitalOf===f.id?4:0)+(enemyNb(t,f.id).some(n=>missionWants(f,n))?2:0); if(s>bs){bs=s;tgt=t;} }
    if(tgt._th>4&&tgt.trench<3&&f.supply>=TRENCH_COST[tgt.trench]&&rand()<.22){ build(f.id,tgt,'trench'); continue; }
    const r=rand(); let type='inf';
    if(tgt.factory&&f.supply>=5&&r<.22) type='tank'; else if(f.supply>=3&&r<.45) type='art'; else if(f.supply>=2&&r<.65) type='mg';
    if(recruit(f.id,tgt,type)) break;
    tgt._th-=UT[type].power;
  }
  let attacks=0;
  for(const t of mine.filter(t=>!t.battle).sort((a,b)=>power(b.units)-power(a.units))){
    if(attacks>=2) break; if(total(t.units)<3) continue;
    const avail=power(t.units)*.85; let best=null,bs=-1e9;
    for(const n of enemyNb(t,f.id)){
      if(armies.some(a=>a.owner===f.id&&a.to===n.id)) continue;
      const margin=avail-defPower(n)*1.3-1.5; if(margin<=0) continue;
      const s=margin+(missionWants(f,n)?6:0)+(n.capitalOf>=0?3:0)-defPower(n)*.2+rand()*2;
      if(s>bs){bs=s;best=n;} }
    if(best&&!sendArmy(f.id,t.id,best.id,.85)) attacks++;
  }
  const dist={}; const q=[]; for(const t of border){dist[t.id]=0;q.push(t);}
  for(let h=0;h<q.length;h++){ const t=q[h]; for(const j of t.adj){ const n=terrs[j]; if(n.owner===f.id&&dist[j]===undefined){dist[j]=dist[t.id]+1;q.push(n);} } }
  for(const t of mine){ if(t.battle||!dist[t.id]||total(t.units)<2) continue;
    const n=[...t.adj].map(j=>terrs[j]).filter(n=>n.owner===f.id&&dist[n.id]<dist[t.id])[0]; if(n) sendArmy(f.id,t.id,n.id,1); }
}

const routes=ROUTES.map(R=>{ const p=[]; for(let i=0;i<R.length;i+=2) p.push([wxLon(R[i]),wzLat(R[i+1])]); let L=0; const seg=[]; for(let i=0;i<p.length-1;i++){ const l=Math.hypot(p[i+1][0]-p[i][0],p[i+1][1]-p[i][1]); seg.push(l); L+=l; } return {p,seg,L}; });
const ships=[]; routes.forEach((r,ri)=>{ for(let k=0;k<2;k++) ships.push({r:ri,s:rand()*r.L,dir:k?1:-1,smoke:rand()}); });
function routePos(r,s){ s=((s%r.L)+r.L)%r.L; for(let i=0;i<r.seg.length;i++){ if(s<=r.seg[i]){ const t=s/r.seg[i], a=r.p[i], b=r.p[i+1]; return [lerp(a[0],b[0],t),lerp(a[1],b[1],t),Math.atan2(b[0]-a[0],b[1]-a[1])]; } s-=r.seg[i]; } const e=r.p[r.p.length-1]; return [e[0],e[1],0]; }
const cloudSet=[]; for(let k=0;k<34;k++){ const n=5+Math.floor(srand()*8), bx=[]; for(let j=0;j<n;j++) bx.push([(srand()-.5)*3.2,srand()*.35,(srand()-.5)*1.6,.8+srand()*1.4,.35+srand()*.35,.6+srand()*1]); cloudSet.push({x:(srand()-.5)*2*HW,z:(srand()-.5)*1.7*HH,y:7+srand()*2.5,bx,sp:.4+srand()*.4}); }

/* =========================================================
   simulation step
   ========================================================= */
function step(dt){
  G.time+=dt; G.supplyT+=dt;
  if(G.supplyT>=TICK){ G.supplyT-=TICK; supplyTick(); }
  for(let i=armies.length-1;i>=0;i--){ const a=armies[i]; a.t+=dt/a.dur; if(a.t>=1){ armies.splice(i,1); arrive(a); panelDirty=true; } }
  for(const b of battles) stepBattle(b,dt);
  for(let i=battles.length-1;i>=0;i--) if(battles[i].ended&&G.time>battles[i].removeAt){ disposeBattle(battles[i]); battles.splice(i,1); }
  for(const f of factions){ if(!f.alive||f.id===G.player) continue; f.aiT-=dt; if(f.aiT<=0){ f.aiT=(2.5+rand()*1.8)*DIFFS[G.diff??1].ai; aiThink(f); } }
  ambient(dt);
}
let ambT=0;
function ambient(dt){
  ambT+=dt;
  for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.life+=dt; if(p.life>=p.max){ parts[i]=parts[parts.length-1]; parts.pop(); continue; }
    p.vy-=p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.z+=p.vz*dt; if(p.floor!==undefined&&p.y<p.floor){p.y=p.floor;p.vx*=.4;p.vz*=.4;p.vy=0;} }
  if(parts.length>4000) parts.splice(0,parts.length-4000);
  for(let i=tracers.length-1;i>=0;i--){ tracers[i].life+=dt; if(tracers[i].life>=tracers[i].max) tracers.splice(i,1); }
  const tick=Math.floor(ambT*2)!==Math.floor((ambT-dt)*2);
  if(tick) for(const t of terrs) if(t.factory&&!t.battle&&rand()<.7){ const y=tileH[t.anchor];
    parts.push({x:t.cx+1.1,y:y+.62,z:t.cz-.5,vx:.06,vy:.25,vz:-.02,g:0,life:0,max:2.4,s:.1,s1:.3,c:K.smoke,map:true}); }
  for(const s of ships){ s.s+=s.dir*dt*.7; s.smoke-=dt; if(s.smoke<=0){ s.smoke=.35; const [x,z,f]=routePos(routes[s.r],s.s); const fc=s.dir>0?f:f+Math.PI;
    parts.push({x:x-Math.sin(fc)*.03,y:.3,z:z-Math.cos(fc)*.03,vx:-Math.sin(fc)*.1,vy:.12,vz:-Math.cos(fc)*.1,g:0,life:0,max:1.8,s:.04,s1:.12,c:K.smoke2}); } }
  for(const c of cloudSet){ c.x+=c.sp*dt; if(c.x>HW+4) c.x=-HW-4; }
}

  if(keys.has('a')||keys.has('arrowleft')) cam.gx-=sp; if(keys.has('d')||keys.has('arrowright')) cam.gx+=sp;

/* mission progress */
function missionFrac(f){
  const m=f.mission, mine=terrs.filter(t=>t.owner===f.id);
  if(m.type==='conts'||m.type==='conts1'){ const ts=terrs.filter(t=>m.conts.includes(t.cont)); return ts.filter(t=>t.owner===f.id).length/ts.length; }
  if(m.type==='count') return Math.min(1,mine.length/m.n);
  if(m.type==='count2') return Math.min(1,mine.filter(t=>total(t.units)>=2).length/m.n);
  if(m.type==='destroy'){ const n=nTerr(m.target); return clamp(1-n/Math.max(1,m.n0||n),0,1); }
  return 0;
}

    h+='</div>';
  } else if(myNb.length){
    h+=`<div class="tb-body">${sharePicker()}<div class="lbl"><span>Attack from</span></div>${myNb.map(n=>`<div class="it nb"><i class="dot" style="--c:${FACTIONS[n.owner].color}"></i><div class="tx"><b>${n.name}</b><small><span data-k="nu${n.id}"></span> available${seaLane.has(t.id+'|'+n.id)?' · by sea':''}</small></div><button class="buy atk" data-act="from:${n.id}">Attack</button></div>`).join('')}</div>`;
  } else h+=`<div class="pad"><p class="note" style="margin:0">None of your regions border ${t.name}. Take a neighbouring region first, or look for a sea lane.</p></div>`;
  drawer.innerHTML=h;
}
function updateDrawer(){
  const t=terrs[G.sel]; const key=t?`${t.id}|${t.owner}|${t.battle?1:0}|${G.tab}|${G.player}`:'none';
  if(key!==panelKey){ panelKey=key; buildDrawer(); }
  if(!t) return;
  const q=k=>drawer.querySelector(`[data-k="${k}"]`), set=(k,v)=>{ const e=q(k); if(e&&e.textContent!==String(v)) e.textContent=v; };
  const u=garrisonOf(t); TYPES.forEach(k=>set(k,u[k])); set('power',Math.round(power(u)*(1+.3*t.trench)));
  const tr=q('trench'); if(tr){ tr.textContent=t.trench?`Trench ${'I'.repeat(t.trench)}`:'No trench'; tr.className='wk'+(t.trench?'':' off'); }
  const fe=q('fac'); if(fe) fe.className='wk'+(t.factory?'':' off'); const be=q('bar'); if(be) be.className='wk'+(t.barracks?'':' off');
  const f=factions[G.player];
  if(t.battle) set('bcount',`${t.battle.agents.filter(a=>!a.dead).length} engaged`);
  set('tpips','■'.repeat(t.trench)+'□'.repeat(3-t.trench));
  const tb=q('tbtn'); if(tb){ const full=t.trench>=3; const html=full?'Max':`<i class="sup"></i>${TRENCH_COST[t.trench]}`; if(tb.__h!==html){ tb.__h=html; tb.innerHTML=html; } tb.disabled=full||f.supply<TRENCH_COST[t.trench]; }
  const fb=q('fbtn'); if(fb){ const html=t.factory?'Built':`<i class="sup"></i>${COST.factory}`; if(fb.__h!==html){ fb.__h=html; fb.innerHTML=html; } fb.parentElement.disabled=t.factory||f.supply<COST.factory; }
  const bb=q('bbtn'); if(bb){ const html=t.barracks?'Built':`<i class="sup"></i>${COST.barracks}`; if(bb.__h!==html){ bb.__h=html; bb.innerHTML=html; } bb.parentElement.disabled=t.barracks||f.supply<COST.barracks; }
  drawer.querySelectorAll('[data-act^="rec:"]').forEach(b=>{ const k=b.dataset.act.slice(4); b.disabled=f.supply<COST[k]||(k==='tank'&&!t.factory); b.title=k==='tank'&&!t.factory?'Build a factory here first':'Shift-click buys 5'; });
  drawer.querySelectorAll('[data-frac]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.frac===G.sendFrac));
  drawer.querySelectorAll('[data-act^="go:"]').forEach(b=>{ const n=terrs[+b.dataset.act.slice(3)]; set('nu'+n.id,`${total(garrisonOf(n))} units`); b.disabled=!!t.battle||total(t.units)<2; });
  drawer.querySelectorAll('[data-act^="from:"]').forEach(b=>{ const n=terrs[+b.dataset.act.slice(5)]; set('nu'+n.id,`${total(garrisonOf(n))} units`); b.disabled=!!n.battle||total(n.units)<2; });
}
function doRecruit(t,type,n=1){
  let err=null; for(let i=0;i<n&&!err;i++) err=recruit(G.player,t,type);
  if(err){ toast(err); Sfx.deny(); } else { tut(2); Sfx.click(); } panelDirty=true;
}
function doGo(from,to){
  const err=sendArmy(G.player,from.id,to.id,G.sendFrac); if(err){ toast(err); Sfx.deny(); return; }
  const a=armies[armies.length-1];
  if(to.owner!==G.player) log(`${total(a.units)} units march from ${from.name} on ${to.name}.`,'me'); tut(3); Sfx.click(); panelDirty=true;
}
drawer.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b||b.disabled) return;
  if(b.dataset.tab){ G.tab=b.dataset.tab; panelKey=''; panelDirty=true; Sfx.click(); return; }
  if(b.dataset.frac){ G.sendFrac=+b.dataset.frac; Sfx.click(); panelDirty=true; return; }
  const [act,arg]=(b.dataset.act||'').split(':'); const t=terrs[G.sel]; if(!t) return;
  if(act==='close') select(-1);
  else if(act==='watch') flyTo(t,6);
  else if(act==='rec') doRecruit(t,arg,e.shiftKey?5:1);
  else if(act==='build'){ const err=build(G.player,t,arg); if(err){ toast(err); Sfx.deny(); } else Sfx.click(); }
  else if(act==='go') doGo(t,terrs[+arg]);
  else if(act==='from') doGo(terrs[+arg],t);
  panelDirty=true;
});

function updateBattleCard(){
  const el=$('#bcard'); if(cam.dist>26){ el.hidden=true; tutNear=false; return; }
  let b=null,bd=12; for(const x of battles){ const d=Math.hypot(x.cx-cam.tx,x.cz-cam.tz); if(d<bd){bd=d;b=x;} }
  if(!b){ el.hidden=true; return; }
  tut(4); el.hidden=false;
  const by={}; for(const a of b.agents){ by[a.f]=by[a.f]||{alive:0,all:0}; by[a.f].all++; if(!a.dead) by[a.f].alive++; }
  const st=b.ended?'Over':`${Math.floor(b.age)} s`;
  setHTML(el,`<div class="bt"><b>Battle of ${b.t.name}</b><small>${st}</small></div>`+Object.entries(by).map(([f,v])=>`<div class="side"><span class="nm"><i class="dot" style="--c:${FACTIONS[f].color}"></i>${FACTIONS[f].short}${+f===b.t.owner?' · def.':''}</span><span class="sb" style="--c:${FACTIONS[f].color}"><i style="width:${v.all?v.alive/v.all*100:0}%"></i></span><span class="n">${v.alive}/${v.all}</span></div>`).join(''));
}
let tutNear=false;

/* =========================================================
   modals & game flow
   ========================================================= */
const modal=$('#modal'), sheet=$('#sheet');
function openModal(html,narrow){ sheet.className='sheet glass'+(narrow?' narrow':''); sheet.innerHTML=html; modal.hidden=false; G.modalOpen=true; const b=sheet.querySelector('.primary,button'); b&&b.focus({preventScroll:true}); }
function closeModal(){ modal.hidden=true; G.modalOpen=false; G.menuOpen=false; }
const readSave=()=>{ try{ const s=localStorage.getItem('f14save'); return s?JSON.parse(s):null; }catch(e){ return null; } };
function showStart(){
  G.running=false; let pick=-1, diff=G.diff??1; const sv=readSave();
  const draw=()=>{
    openModal(`<div><div class="kicker">The world at war · August 1914</div><h1>Fronts<br>of 1914</h1></div>
    <p class="lede">Six empires, one map. Supply convoys reach every power at the same instant, so everybody builds and marches at once. Claim regions, dig in, and finish your sealed orders before anyone else finishes theirs. Battles fight themselves. Zoom in and watch.</p>
    <div><div class="lbl" style="padding-left:0"><span>Choose your power</span></div><div class="picks">${FACTIONS.map((f,i)=>`<button class="pick" data-pick="${i}" aria-pressed="${pick===i}" style="--c:${f.color}"><i></i><div><b>${f.name}</b><span>Capital: ${f.capital}</span></div></button>`).join('')}</div></div>
    <div class="row" style="justify-content:space-between"><div><div class="lbl" style="padding-left:0"><span>Difficulty · ${DIFFS[diff].desc}</span></div><div class="seg">${DIFFS.map((d,i)=>`<button data-diff="${i}" class="${i===diff?'on':''}">${d.name}</button>`).join('')}</div></div>
    <div class="row">${sv?'<button class="btn" id="m-cont">Continue saved war</button>':''}<button class="btn primary" id="m-start" ${pick<0?'disabled':''}>Begin the war</button></div></div>`);
    sheet.querySelectorAll('[data-pick]').forEach(b=>b.addEventListener('click',()=>{ pick=+b.dataset.pick; Sfx.init(); Sfx.click(); draw(); }));
    sheet.querySelectorAll('[data-diff]').forEach(b=>b.addEventListener('click',()=>{ diff=+b.dataset.diff; Sfx.click(); draw(); }));
    $('#m-start')?.addEventListener('click',()=>{ Sfx.init(); newGame(pick,diff); showOrders(true); });
    $('#m-cont')?.addEventListener('click',()=>{ Sfx.init(); if(loadGame(sv)){ closeModal(); G.running=true; G.started=true; setSpeed(1); } });
  };
  draw();
}
function progressHtml(f){
  const m=f.mission, mine=terrs.filter(t=>t.owner===f.id);
  const cp=k=>{ const all=terrs.filter(t=>t.cont===k); return `<span>${CONT[k].name}<b>${all.filter(t=>t.owner===f.id).length}/${all.length}</b></span>`; };
  if(m.type==='conts'||m.type==='conts1') return m.conts.map(cp).join('')+(m.type==='conts1'?'<span>plus one more continent</span>':'');
  if(m.type==='count') return `<span>Regions held<b>${mine.length}/${m.n}</b></span>`;
  if(m.type==='count2') return `<span>Garrisoned regions<b>${mine.filter(t=>total(t.units)>=2).length}/${m.n}</b></span>`;
  if(m.type==='destroy') return `<span>${factions[m.target].name} regions left<b>${nTerr(m.target)}</b></span>`;
}
function showOrders(first){
  const f=factions[G.player]; if(!f.mission) return;
  const [title,text]=missionText(f.mission);
  if(!first) G.running=false;
  openModal(`<div class="kicker">${f.name} · War Office</div>
   <div class="orders"><span class="stamp">SECRET</span><h2>${title}</h2><p class="lede">${text}</p><div class="prog">${progressHtml(f)}</div></div>
   <p style="color:var(--mute)">Every other power holds its own sealed orders. The first to complete them wins the war, so watch the scoreboard at the top of the screen.</p>
   <div class="row"><button class="btn primary" id="m-go">${first?'Open hostilities':'Back to the map'}</button>${first?'<button class="btn" id="m-help">How to play</button>':''}</div>`,true);
  $('#m-go').addEventListener('click',()=>{ closeModal(); G.running=true; G.started=true; Sfx.click(); if(first){ setSpeed(1); log('War is declared. Sealed orders received.','me'); } });
  $('#m-help')?.addEventListener('click',showHelp);
}
function showHelp(){
  const wasRun=G.started; G.running=false;
  openModal(`<div class="kicker">Field manual</div><h2>How to play</h2>
  <dl class="keys">
   <dt>Click</dt><dd>Select a region. Its file opens on the right: garrison, recruiting, building and march orders.</dd>
   <dt>Right-click</dt><dd>With your region selected, march its troops into a bordering region. Dashed sea lanes count as borders; troops sail across.</dd>
   <dt>Drag · wheel</dt><dd>Pan and zoom. Zoom close to a battle to watch it. Double-click a region to fly there. The minimap in the corner jumps anywhere.</dd>
   <dt>1 2 3 4</dt><dd>Recruit infantry, machine guns, field guns or tanks in the selected region. Shift buys five.</dd>
   <dt>Space · Esc</dt><dd>Pause. Esc deselects, then opens the menu.</dd>
  </dl>
  <p class="lede" style="font-size:15px">Every ${TICK} seconds a convoy arrives: one supply per three regions (minimum three), plus continent bonuses and +2 per factory. Field guns outrange everything, machine guns pin attackers, tanks shrug off rifle fire, and trenches cut the damage defenders take.</p>
  <div class="row"><button class="btn primary" id="m-close">${wasRun?'Back to the map':'Back'}</button></div>`,true);
  $('#m-close').addEventListener('click',()=>{ if(wasRun){ closeModal(); G.running=true; } else showOrders(true); });
}
function showMenu(){
  if(!G.started||G.over) return; G.running=false; G.menuOpen=true;
  const hist=logs.slice(0,10).map(l=>`<div class="${l.cls}"><time>${l.d}</time>${l.text}</div>`).join('')||'<div>Nothing yet.</div>';
  openModal(`<div class="kicker">Paused</div><h2>Menu</h2>
   <div class="menu">
    <button class="btn primary wide" id="mn-res">Resume</button>
    <div class="row"><button class="btn" id="mn-ord">Sealed orders</button><button class="btn" id="mn-help">How to play</button><button class="btn" id="mn-save">Save game</button></div>
    <div class="grp"><span>Graphics</span><div class="seg">${['Ultra','High','Chunky'].map((l,i)=>`<button data-q="${i}" class="${i===QI?'on':''}">${l}</button>`).join('')}</div></div>
    <div class="grp"><span>Sound</span><div class="seg"><button id="mn-snd" class="on">${Sfx.on?'On':'Off'}</button></div></div>
    <div class="grp"><span>Tips</span><div class="seg"><button id="mn-tips" class="on">${G.tips?'On':'Off'}</button></div></div>
    <button class="btn wide" id="mn-quit">Quit to title</button>
    <small>Recent events</small><div class="hist">${hist}</div>
   </div>`,true);
  $('#mn-res').addEventListener('click',closeMenu);
  $('#mn-ord').addEventListener('click',()=>{ closeModal(); showOrders(false); });
  $('#mn-help').addEventListener('click',showHelp);
  $('#mn-save').addEventListener('click',()=>{ toast(saveGame()?'Game saved.':'Saving is not available here.'); });
  sheet.querySelectorAll('[data-q]').forEach(b=>b.addEventListener('click',()=>{ setQuality(+b.dataset.q); sheet.querySelectorAll('[data-q]').forEach(x=>x.classList.toggle('on',x===b)); }));
  $('#mn-snd').addEventListener('click',e=>{ Sfx.init(); Sfx.on=!Sfx.on; e.target.textContent=Sfx.on?'On':'Off'; });
  $('#mn-tips').addEventListener('click',e=>{ G.tips=!G.tips; try{ localStorage.setItem('f14tips',G.tips?'1':'0'); }catch(er){} e.target.textContent=G.tips?'On':'Off'; });
  $('#mn-quit').addEventListener('click',()=>{ saveGame(); G.started=false; showStart(); });
}
function closeMenu(){ closeModal(); G.running=true; }
function onEscape(){
  if(G.orderMode){ G.orderMode=false; canvas.classList.remove('order'); return; }
  if(scoreOpen){ scoreOpen=false; $('#score').hidden=true; return; }
  if(G.sel>=0){ select(-1); return; }
  showMenu();
}
addEventListener('keydown',e=>{ if(e.key==='Escape'&&G.menuOpen) closeMenu(); });
$('#b-menu').addEventListener('click',()=>{ if(G.menuOpen) closeMenu(); else showMenu(); });
$('#mission').addEventListener('click',()=>{ if(G.started&&!G.over) showOrders(false); });

function endGame(winner,why){
  if(G.over) return; G.over=true; G.running=false;
  try{ localStorage.removeItem('f14save'); }catch(e){}
  const won=winner===G.player, W=winner!==null&&winner!==undefined?factions[winner]:null;
  const text=why||(won?`Your sealed orders are fulfilled: ${missionText(factions[G.player].mission)[0].toLowerCase()}.`:`${cap(W.the)} has fulfilled its sealed orders: ${missionText(W.mission)[0].toLowerCase()}.`);
  const days=Math.round(G.day);
  openModal(`<div class="kicker">${dateStr()}</div><h1 style="color:${won?'var(--accent)':'var(--danger)'}">${won?'Victory':'Defeat'}</h1><p class="lede">${text}</p>
   <div class="stats"><div><small>Regions held</small><b>${nTerr(G.player)}</b></div><div><small>Battles won / lost</small><b>${G.stats.won} / ${G.stats.lost}</b></div><div><small>Days of war</small><b>${days}</b></div></div>
   <div class="row"><button class="btn primary" id="m-new">Start a new war</button><button class="btn" id="m-look">Look at the map</button></div>`,true);
  $('#m-new').addEventListener('click',showStart);
  $('#m-look').addEventListener('click',closeModal);
}

/* save / load: in-flight armies return home, running battles are folded back into their region */
function snapshot(){
  const T=terrs.map(t=>({o:t.owner,u:{...t.units},tr:t.trench,f:t.factory,b:t.barracks,c:t.capitalOf}));
  for(const a of armies){ const x=T[a.from]; if(x.o===a.owner) for(const k of TYPES) x.u[k]+=a.units[k]; }
  for(const b of battles){ if(b.ended) continue; const x=T[b.t.id]; x.u=emptyU();
    for(const a of b.agents){ if(a.dead) continue; if(a.f===x.o) x.u[a.type]++; else { const home=[...b.t.adj].find(j=>T[j].o===a.f); if(home!==undefined) T[home].u[a.type]++; } } }
  return {v:1,g:{time:G.time,day:G.day,supplyT:G.supplyT,player:G.player,diff:G.diff,stats:G.stats,tut:G.tut},f:factions.map(f=>({s:f.supply,a:f.alive,m:f.mission})),t:T};
}
function saveGame(){ if(!G.started||G.over) return false; try{ localStorage.setItem('f14save',JSON.stringify(snapshot())); return true; }catch(e){ return false; } }
function loadGame(s){
  if(!s||s.v!==1||s.t.length!==terrs.length) return false;
  battles.forEach(disposeBattle); battles.length=0; armies.forEach(a=>a.el.remove()); armies.length=0; parts.length=0; tracers.length=0; logs.length=0; $('#feed').innerHTML='';
  Object.assign(G,s.g,{over:false,sel:-1,hover:-1,orderMode:false,started:true});
  factions.forEach((f,i)=>{ f.supply=s.f[i].s; f.alive=s.f[i].a; f.mission=s.f[i].m; f.aiT=1.5+rand()*2; });
  terrs.forEach((t,i)=>{ const o=s.t[i]; Object.assign(t,{owner:o.o,units:o.u,trench:o.tr,factory:o.f,barracks:o.b,capitalOf:o.c,battle:null}); });
  paintAll(); panelKey=''; panelDirty=true; skin(G.player); flyTo(byName[factions[G.player].capital],34); return true;
}
function skin(pid){ $('#crest').style.setProperty('--c',FACTIONS[pid].color); $('#crest').textContent=FACTIONS[pid].key; }

function newGame(pid,diff=1){
  battles.forEach(disposeBattle); battles.length=0; armies.forEach(a=>a.el.remove()); armies.length=0; parts.length=0; tracers.length=0; logs.length=0; $('#feed').innerHTML='';
  Object.assign(G,{time:0,day:0,supplyT:0,over:false,player:pid,sel:-1,hover:-1,orderMode:false,started:false,diff,tut:0,stats:{won:0,lost:0}});
  factions.forEach(f=>{ f.supply=f.id===pid?8:5; f.alive=true; f.aiT=1.5+rand()*2; });
  terrs.forEach(t=>{ t.owner=-1; t.units=emptyU(); t.trench=0; t.factory=false; t.barracks=false; t.capitalOf=-1; t.battle=null; });
  factions.forEach(f=>{ const t=byName[f.capital]; t.owner=f.id; t.capitalOf=f.id; t.units={inf:6,mg:2,art:1,tank:0}; t.trench=2; t.factory=true; });
  const rest=shuffle(terrs.filter(t=>t.owner<0)), off=Math.floor(rand()*6);
  rest.forEach((t,k)=>{ t.owner=(k+off)%6; t.units.inf=2+(rand()<.5?1:0); });
  const pool=shuffle(buildMissions());
  factions.forEach(f=>{ const i=pool.findIndex(m=>!(m.type==='destroy'&&m.target===f.id)); f.mission=pool.splice(i,1)[0]; });
  factions.forEach(f=>{ if(f.mission.type==='destroy') f.mission.n0=nTerr(f.mission.target); });
  paintAll(); panelKey=''; panelDirty=true; pillsKey=''; miniKey='';
  flyTo(byName[factions[pid].capital],34); skin(pid);
}

/* =========================================================
   boot
   ========================================================= */
try{ const q=localStorage.getItem('f14q'); if(q!==null&&+q>=0&&+q<=2) QI=+q; }catch(e){}
canvas.classList.toggle('smooth',QI===0);
resize();
factions.forEach(f=>f.mission={type:'count',n:30});
newGame(0,1);
cam.tx=cam.gx=12; cam.tz=cam.gz=-16; cam.dist=cam.gdist=70;
showStart();
let last=performance.now(), uiT=0, saveT=0;
function frame(now){
  requestAnimationFrame(frame);
  const rdt=Math.min(.05,(now-last)/1000); last=now;
  if(G.running&&!G.over&&G.speed>0){ let g=rdt*G.speed; while(g>1e-6){ const s=Math.min(g,.05); step(s); g-=s; } saveT+=rdt; if(saveT>45){ saveT=0; saveGame(); } }
  else ambient(rdt*.5);
  updateCamera(rdt); draw();
  grade.uniforms.uAmt.value=lerp(2.2,1.0,smooth(8,90,cam.dist)); grade.uniforms.uRes.value.set(renderer.domElement.width,renderer.domElement.height);
  bloom.strength=lerp(.55,.3,smooth(10,60,cam.dist));
  try{ composer.render(); }catch(e){ if(!frame.err){ frame.err=1; console.warn('post-processing disabled',e); } renderer.render(scene,camera); }
  updateLabels(); Sfx.level(battles.reduce((n,b)=>n+(b.ended?0:1),0),cam.dist);
  uiT+=rdt; if(uiT>.2||panelDirty){ uiT=0; panelDirty=false; updateTop(); updateDrawer(); updateBattleCard(); }
  drawMini();
}
requestAnimationFrame(frame);
window.__G={G,terrs,factions,battles,armies,cam,step,sendArmy,flyTo,select,newGame,snapshot,loadGame,composer,Sfx};
</script>
